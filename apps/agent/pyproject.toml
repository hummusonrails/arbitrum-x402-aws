[project]
name = "x402-aws-agent"
version = "0.1.0"
description = "AWS Bedrock AgentCore-based x402 buyer agent for Arbitrum One USDC payments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35.0",
    "bedrock-agentcore[strands-agents]>=0.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
x402-aws-agent-setup = "x402_aws_agent.setup:main"
x402-aws-agent-run = "x402_aws_agent.run:main"
x402-aws-agent-teardown = "x402_aws_agent.teardown:main"

[dependency-groups]
dev = [
    "cdp-sdk==1.45.2",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_aws_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
